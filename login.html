<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — The Arcane Emporium</title>
  <meta name="description"
    content="Login to The Arcane Emporium. Enter your secret password and return to the catalog of wonders." />
  <link rel="canonical" href="login.html" />

  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <link href="assets/css/dark-mode.css" rel="stylesheet" />
  <link href="assets/css/rtl.css" rel="stylesheet" />
</head>

<body data-ae-no-chrome>
  <a class="ae-skip" href="#main">Skip to content</a>

  <main id="main" class="ae-section ae-section--full">
    <div class="ae-container">
      <div class="ae-auth-container">
        <div class="d-flex align-items-center justify-content-end gap-2 mb-3">
          <button class="ae-icon-btn" type="button" data-ae-theme-toggle aria-label="Toggle theme" aria-pressed="false">
            <i class="bi bi-sun-fill" aria-hidden="true"></i>
          </button>
          <button class="ae-icon-btn" type="button" data-ae-dir-toggle aria-label="Toggle direction"
            aria-pressed="false">LTR</button>
        </div>

        <div class="ae-card">
          <div class="text-center">
            <a class="ae-logo-wrap" href="index.html" aria-label="Back to The Arcane Emporium">
              <svg class="ae-logo ae-logo--small" aria-hidden="true" focusable="false">
                <use href="assets/images/logo.svg#ae-logo"></use>
              </svg>
            </a>
          </div>

          <h3 class="mt-4 mb-4 text-center">Enter the back room</h3>

          <form class="d-grid gap-3" data-ae-validate novalidate>
            <div>
              <label class="fw-bold" for="loginEmail">Email</label>
              <input class="ae-form-control w-100" id="loginEmail" name="email" type="email" required
                autocomplete="email" />
              <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
            <div>
              <label class="fw-bold" for="loginPassword">Password</label>
              <div class="ae-password-group">
                <input class="ae-form-control w-100" id="loginPassword" name="password" type="password" required
                  minlength="8" autocomplete="current-password" />
                <button class="ae-password-toggle" type="button" aria-label="Show password"
                  aria-controls="loginPassword" data-ae-password-toggle aria-pressed="false">
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
              <div class="invalid-feedback">Enter your password (at least 8 characters).</div>
            </div>

            <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
              <div class="form-check m-0">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label fw-bold" for="rememberMe">Remember me</label>
              </div>
              <a href="#" class="fw-bold">Forgot password?</a>
            </div>

            <button class="ae-btn" type="submit">Login</button>
          </form>

          <div class="mt-4 ae-border ae-rounded p-3">
            <p class="m-0" style="font-weight:800">Or continue with</p>
            <div class="mt-3 d-grid gap-2">
              <a class="ae-btn ae-btn--ghost" href="#"><i class="bi bi-google" aria-hidden="true"></i>Google</a>
              <a class="ae-btn ae-btn--ghost" href="#"><i class="bi bi-apple" aria-hidden="true"></i>Apple</a>
            </div>
          </div>

          <div class="mt-4 d-flex align-items-center justify-content-between gap-2 flex-wrap">
            <a href="register.html">New here? Create an account</a>
            <a href="contact.html">Need help?</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
